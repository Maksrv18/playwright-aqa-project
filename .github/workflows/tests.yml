name: Playwright UI tests + Allure

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # каждый день в 02:00 UTC (ночной регресс)

jobs:
  smoke:
    name: Smoke (on push/PR)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      VALID_USER_EMAIL: ${{ secrets.VALID_USER_EMAIL }}
      VALID_USER_PASSWORD: ${{ secrets.VALID_USER_PASSWORD }}
      INVALID_USER_EMAIL: ${{ secrets.INVALID_USER_EMAIL }}
      INVALID_USER_PASSWORD: ${{ secrets.INVALID_USER_PASSWORD }}
      BROWSER: ${{ secrets.BROWSER }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install Allure CLI
        run: |
          npm i -g allure-commandline

      - name: Run SMOKE tests
        run: |
          mkdir -p allure-results test-results
          python -m pytest -v -m smoke \
            --browser ${{ matrix.browser }} \
            --alluredir=allure-results \
            --tracing retain-on-failure \
            --video retain-on-failure \
            --screenshot only-on-failure \
            --output test-results

      - name: Generate Allure report (HTML)
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-smoke-${{ matrix.browser }}
          path: allure-report/

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-smoke-${{ matrix.browser }}
          path: test-results/

  regression:
    name: Regression (nightly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      VALID_USER_EMAIL: ${{ secrets.VALID_USER_EMAIL }}
      VALID_USER_PASSWORD: ${{ secrets.VALID_USER_PASSWORD }}
      INVALID_USER_EMAIL: ${{ secrets.INVALID_USER_EMAIL }}
      INVALID_USER_PASSWORD: ${{ secrets.INVALID_USER_PASSWORD }}
      BROWSER: ${{ secrets.BROWSER }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install Allure CLI
        run: |
          npm i -g allure-commandline

      - name: Run REGRESSION tests
        run: |
          mkdir -p allure-results test-results
          python -m pytest -v -m regression \
            --browser "${BROWSER:-chromium}" \
            --alluredir=allure-results \
            --tracing retain-on-failure \
            --video retain-on-failure \
            --screenshot only-on-failure \
            --output test-results

      - name: Generate Allure report (HTML)
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-regression
          path: allure-report/

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-regression
          path: test-results/