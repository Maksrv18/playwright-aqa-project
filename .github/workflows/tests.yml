name: Playwright UI tests + Allure

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install Allure CLI
        run: |
          npm i -g allure-commandline --save-dev
          allure --version

      - name: Run tests (create allure-results + playwright artifacts)
        run: |
          mkdir -p allure-results test-results
          python -m pytest -v \
            --browser chromium \
            --headless \
            --alluredir=allure-results \
            --tracing retain-on-failure \
            --video retain-on-failure \
            --screenshot only-on-failure \
            --output test-results

      - name: Generate Allure report (HTML)
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Playwright artifacts (trace/video/screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/